name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun: [1.4.2, 1.4.4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun test
      - run: bun run check
      - run: bun run vendor:verify

  # Windows is a supported target. The vendored core is verified here too, so
  # a host-agnostic core cannot silently regress on one platform only.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun test
      - run: bun run check
      - run: bun run vendor:verify
